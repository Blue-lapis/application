<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 検索エンジンに載せない（リンクを知っている人だけが使う）。 -->
<meta name="robots" content="noindex, nofollow">
<title>厳選チェッカー</title>
<script>
// きのみタイプ版は ../checker/ に統合した。ポケモンの指定を引き継いで移動する。
(function () {
  var q = location.search;
  if (!/[?&]mon=/.test(q)) {
    var m = 'walrein';
    try { m = JSON.parse(localStorage.getItem('bfmon')) || m; } catch (e) { /* storage unavailable */ }
    q = '?mon=' + encodeURIComponent(m);
  }
  location.replace('../checker/' + q + location.hash);
})();
</script>
</head>
<body>
<p><a href="../checker/">厳選チェッカー</a>に移動しました。</p>
</body>
</html>
