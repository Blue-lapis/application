<!DOCTYPE html>
<html lang="ja" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>厳選チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<form class="login" id="login" autocomplete="on">
  <h1>厳選チェッカー</h1>
  <label for="loginPw">暗証番号（数字4桁）</label>
  <input type="password" id="loginPw" name="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
  <button type="submit">ログイン</button>
  <p class="loginmsg" id="loginMsg" role="status"></p>
</form>

<nav class="tabs" aria-label="タイプ">
  <div class="tabs-in" role="tablist" id="tabs"></div>
</nav>

<main>
  <div class="col-in">
    <header>
      <h1><span id="monName"></span><small id="typeName">厳選チェッカー</small></h1>
      <img class="monimg" id="monImg" alt="" width="96" height="96">
    </header>

    <section class="mon">
      <div class="natname"><span>ポケモン</span><button class="monbtn" id="monBtn" aria-haspopup="dialog"></button></div>
      <div class="facts" id="facts"></div>
      <div class="cond" id="monInfo"></div>
    </section>

    <section id="arrSec">
      <h2>食材配列</h2>
      <div class="slot"><span>狙い</span><div class="chips" id="target"></div></div>
      <div id="arr"></div>
    </section>

    <section>
      <div class="sec-head">
        <h2>サブスキル</h2>
        <div class="mode" role="group" aria-label="対象レベル"><button data-n="3">Lv.50まで</button><button data-n="4">Lv.70まで</button><button data-n="5">Lv.80まで</button></div>
      </div>
      <div class="subslots" id="slots"></div>
    </section>

    <section>
      <h2>性格</h2>
      <button class="natbtn" id="natBtn" aria-haspopup="dialog"></button>
    </section>
    <button class="reset" id="reset">サブスキル・性格を消す</button>
  </div>

  <div class="col-out">
    <section>
      <div class="perf-head"><h2>性能</h2><div class="sws"><label class="switch"><input type="checkbox" id="camp" role="switch"><span><span>いいキャンプ</span><span>チケット</span></span></label><label class="switch" id="g80Sw"><input type="checkbox" id="g80" role="switch"><span><span>げんき常時</span><span>81%以上</span></span></label></div></div>
      <div class="params" id="params" hidden>
        <div class="prow"><span>ヒーラー</span><div class="mode" role="group" aria-label="ヒーラー（げんきオールS）" id="healSeg"><button data-v="0">なし</button><button data-v="1">1匹</button><button data-v="2">2匹</button><button data-v="g80">常に81%以上</button></div></div>
        <div class="prow"><span>日中の受け取り</span><div class="mode" role="group" aria-label="日中の受け取り" id="tapSeg"><button data-v="none">なし（いつ育）</button><button data-v="3h">3時間ごと</button></div></div>
        <div class="prow"><label class="switch"><input type="checkbox" id="team" role="switch"><span><span>おてつだいボーナスの</span><span>チームへの効果を含める</span></span></label></div>
        <div class="psum"><p id="paramSum"></p><button class="txt" id="paramBtn" aria-haspopup="dialog">詳細</button></div>
      </div>
      <p class="cond" id="cond"></p>
      <div class="hero">
        <div class="stat main"><small id="hLabel">—</small><b id="hAll">—</b></div>
        <div class="split" aria-hidden="true"><i id="hSplit"></i></div>
        <div class="stat"><small>日中</small><b id="hDay">—</b></div>
        <div class="stat"><small>睡眠中</small><b id="hNight">—</b></div>
      </div>
      <dl class="rows" id="rows"></dl>
    </section>

    <section>
      <h2>記録</h2>
      <ul class="log" id="log"></ul>
    </section>
    <p class="credit">ゲーム画像の著作権は ©Pokémon. ©Nintendo/Creatures Inc./GAME FREAK inc. ©SELECT BUTTON inc. に帰属します。</p>
    <button class="logout" id="logout" type="button" hidden>ログアウト</button>
  </div>
</main>

<div class="bar" role="status" aria-live="polite">
  <div class="bar-in">
    <div><small>無補正比</small><b id="bRatio" class="dim">—</b></div>
    <div><small>上位</small><b id="bRank" class="dim">—</b><small class="pos" id="bPos"></small></div>
    <div><small>何匹に1匹</small><b id="bOdds" class="dim">—</b></div>
    <button class="save" id="save" disabled>記録</button>
  </div>
</div>

<dialog class="sheet" id="subDlg" aria-labelledby="subTitle">
  <div class="dlg-in">
    <h2 id="subTitle" tabindex="-1" autofocus></h2>
    <div class="dlg-tabs" id="subTabs" role="group" aria-label="枠"></div>
    <div id="subBody"></div>
    <p class="note" id="subNote"></p>
    <div class="dlg-foot"><button class="txt" id="subClear">全枠クリア</button><button class="primary" id="subClose">閉じる</button></div>
  </div>
</dialog>

<dialog class="sheet" id="monDlg" aria-labelledby="monTitle">
  <div class="dlg-in">
    <h2 id="monTitle" tabindex="-1" autofocus>ポケモンを選んでください</h2>
    <input type="search" class="monq" id="monQ" placeholder="名前で探す（例: ふしばな）" aria-label="ポケモンの名前で探す" autocomplete="off" enterkeyhint="done">
    <div class="mongrid" id="monGrid"></div>
    <p class="note" id="monNone" hidden>見つかりませんでした</p>
    <div class="dlg-foot"><span></span><button class="primary" id="monClose">閉じる</button></div>
  </div>
</dialog>

<dialog class="sheet" id="natDlg" aria-labelledby="natTitle">
  <div class="dlg-in">
    <h2 id="natTitle" tabindex="-1" autofocus>性格を選んでください</h2>
    <div class="natgrid" id="natGrid"></div>
    <p class="note" id="natNote"></p>
    <div class="dlg-foot"><button class="txt" id="natClear">クリア</button><button class="primary" id="natClose">閉じる</button></div>
  </div>
</dialog>

<dialog class="sheet" id="paramDlg" aria-labelledby="paramTitle">
  <div class="dlg-in">
    <h2 id="paramTitle" tabindex="-1" autofocus>パラメーターの詳細</h2>
    <h3>ヒーラー（げんきオールS）</h3>
    <div class="nums">
      <label class="num"><span>1回の回復量</span><input type="number" id="healAmt" min="1" max="150" step="1" inputmode="numeric"></label>
      <label class="num"><span>1匹あたりの1日の発動回数</span><input type="number" id="healTimes" min="0" max="20" step="1" inputmode="numeric"></label>
    </div>
    <p class="note" id="paramNote"></p>
    <div class="dlg-foot"><button class="txt" id="paramReset">初期値に戻す</button><button class="primary" id="paramClose">閉じる</button></div>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
