<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>厳選チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<nav class="tabs" aria-label="タイプ">
  <div class="tabs-in" role="tablist" id="tabs"></div>
</nav>

<main>
  <div class="col-in">
    <header>
      <h1><span id="monName"></span><small id="typeName">厳選チェッカー</small></h1>
    </header>

    <section class="mon">
      <label class="natname"><span>ポケモン</span><select id="mon"></select></label>
      <div class="facts" id="facts"></div>
      <p class="cond" id="monInfo"></p>
    </section>

    <section id="arrSec">
      <h2>食材配列</h2>
      <div class="slot"><span>狙い</span><div class="chips" id="target"></div></div>
      <div id="arr"></div>
    </section>

    <section>
      <div class="sec-head">
        <h2>サブスキル</h2>
        <div class="mode" role="group" aria-label="対象レベル"><button data-n="3">Lv.50まで</button><button data-n="4">Lv.70まで</button><button data-n="5">Lv.80まで</button></div>
      </div>
      <div class="subslots" id="slots"></div>
    </section>

    <section>
      <h2>性格</h2>
      <button class="natbtn" id="natBtn" aria-haspopup="dialog"></button>
    </section>
    <button class="reset" id="reset">サブスキル・性格を消す</button>
  </div>

  <div class="col-out">
    <section>
      <div class="perf-head"><h2>性能</h2><div class="sws"><label class="switch"><input type="checkbox" id="camp" role="switch"><span><span>いいキャンプ</span><span>チケット</span></span></label><label class="switch"><input type="checkbox" id="g80" role="switch"><span><span>げんき常時</span><span>81%以上</span></span></label></div></div>
      <p class="cond" id="cond"></p>
      <div class="hero">
        <div class="stat main"><small id="hLabel">—</small><b id="hAll">—</b></div>
        <div class="split" aria-hidden="true"><i id="hSplit"></i></div>
        <div class="stat"><small>日中</small><b id="hDay">—</b></div>
        <div class="stat"><small>睡眠中</small><b id="hNight">—</b></div>
      </div>
      <dl class="rows" id="rows"></dl>
    </section>

    <section>
      <h2>記録</h2>
      <ul class="log" id="log"></ul>
    </section>
    <p class="credit">ゲーム画像の著作権は ©Pokémon. ©Nintendo/Creatures Inc./GAME FREAK inc. ©SELECT BUTTON inc. に帰属します。</p>
  </div>
</main>

<div class="bar" role="status" aria-live="polite">
  <div class="bar-in">
    <div><small>無補正比</small><b id="bRatio" class="dim">—</b></div>
    <div><small>上位</small><b id="bRank" class="dim">—</b><small class="pos" id="bPos"></small></div>
    <div><small>何匹に1匹</small><b id="bOdds" class="dim">—</b></div>
    <button class="save" id="save" disabled>記録</button>
  </div>
</div>

<dialog class="sheet" id="subDlg" aria-labelledby="subTitle">
  <div class="dlg-in">
    <h2 id="subTitle" tabindex="-1" autofocus></h2>
    <div class="dlg-tabs" id="subTabs" role="group" aria-label="枠"></div>
    <div id="subBody"></div>
    <p class="note" id="subNote"></p>
    <div class="dlg-foot"><button class="txt" id="subClear">全枠クリア</button><button class="primary" id="subClose">閉じる</button></div>
  </div>
</dialog>

<dialog class="sheet" id="natDlg" aria-labelledby="natTitle">
  <div class="dlg-in">
    <h2 id="natTitle" tabindex="-1" autofocus>性格を選んでください</h2>
    <div class="natgrid" id="natGrid"></div>
    <p class="note" id="natNote"></p>
    <div class="dlg-foot"><button class="txt" id="natClear">クリア</button><button class="primary" id="natClose">閉じる</button></div>
  </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
