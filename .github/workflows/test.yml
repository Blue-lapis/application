name: Test

# 計算の整合性テスト。PR では変更を取り込む前に確かめ、main への push では公開（pages.yml）の前に呼ばれる。
# テストを足すときはここだけ書き換える。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check-segs.mjs
      - run: node tests/check-dist.mjs
      - run: node tests/check-boost.mjs
      - run: node tests/check-exp.mjs
      - run: node tests/check-draft.mjs
