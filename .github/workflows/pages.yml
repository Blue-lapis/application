name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 公開物に入らないファイル（設計書・テスト・リポジトリ直下の README）だけを変えた push では公開しない。
    # 公開し直すと版（?v=コミット）が変わり、利用者の端末に保存した分布（IndexedDB）を読み直させてしまうため。
    # テストは PR で test.yml が動く。手で公開したいときは Actions の画面から実行する（workflow_dispatch）。
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 計算の整合性テスト（test.yml。PR でも同じものが動く）。build と並べて走らせ、通らなければ公開しない（deploy が両方を待つ）。
  test:
    uses: ./.github/workflows/test.yml

  # 公開するファイルを作る。分布の事前計算はいちばん時間がかかる（約3分）ので、計算に関わるファイルが前回と同じなら使い回す。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 分布の計算に関わるファイル（precompute-dist.mjs から import をたどったもの）の中身と Node の版から作るキー。
      # 画面だけの変更ならキーは変わらない（scripts/dist-key.mjs）。版を付ける前に作る。
      - name: Key of precomputed distributions
        id: distkey
        run: echo "key=$(node scripts/dist-key.mjs --list)" >> "$GITHUB_OUTPUT"
      - name: Restore precomputed distributions
        id: distcache
        uses: actions/cache@v4
        with:
          path: checker/dist
          key: checker-dist-${{ steps.distkey.outputs.key }}
      # 既定の条件の上位%の分布を事前計算して checker/dist/ に置き、公開物に含める（ver1.9）。
      # 使い回せないとき（キーが変わったとき）だけ、今のコードで作り直す。版を付ける前（?v= のない import）で実行する。
      - name: Precompute distributions
        if: steps.distcache.outputs.cache-hit != 'true'
        run: node scripts/precompute-dist.mjs
      # ファイルがそろっていることと、抜き取りで計算した分布とビットまで一致することを、使い回したときも確かめる。
      - name: Check precomputed distributions
        run: node tests/check-precomputed.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Pages caches files for 10 minutes; versioned URLs keep a browser from mixing old and new modules.
      - name: Add version to asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"(\.\./)?css/[a-z]+\.css)\"#\1?v=$v\"#g; s#(src=\"js/main\.js)\"#\1?v=$v\"#" checker/index.html
          sed -i -E "s#(href=\"[^\"]*\.css)\"#\1?v=$v\"#g; s#(src=\"js/main\.js)\"#\1?v=$v\"#" exp/index.html
          sed -i -E "s#(from '\.{1,2}/[^'?]*\.js)'#\1?v=$v'#g" js/*.js checker/js/*.js checker/js/*/*.js exp/js/*.js
          grep -c "?v=$v" js/*.js checker/index.html checker/js/*.js checker/js/*/*.js exp/index.html exp/js/*.js
      # 公開するのはアプリのファイルだけ（tests/・docs/ などは含めない）。
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html berry ingredient checker exp css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [test, build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
