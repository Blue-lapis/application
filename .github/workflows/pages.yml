name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 計算の整合性テスト（test.yml。PR でも同じものが動く）。通らなければ公開しない。
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 既定の条件の上位%の分布を事前計算して checker/dist/ に置き、公開物に含める（ver1.9）。
      # 毎回今のコードで作り直す。版を付ける前（?v= のない import）で実行する。
      - name: Precompute distributions
        run: node scripts/precompute-dist.mjs
      # ファイルがそろっていることと、抜き取りで計算した分布とビットまで一致することを確かめる。
      - name: Check precomputed distributions
        run: node tests/check-precomputed.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Pages caches files for 10 minutes; versioned URLs keep a browser from mixing old and new modules.
      - name: Add version to asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"(\.\./)?css/[a-z]+\.css)\"#\1?v=$v\"#g; s#(src=\"js/main\.js)\"#\1?v=$v\"#" checker/index.html
          sed -i -E "s#(href=\"[^\"]*\.css)\"#\1?v=$v\"#g; s#(src=\"js/main\.js)\"#\1?v=$v\"#" exp/index.html
          sed -i -E "s#(from '\.{1,2}/[^'?]*\.js)'#\1?v=$v'#g" js/*.js checker/js/*.js checker/js/*/*.js exp/js/*.js
          grep -c "?v=$v" js/*.js checker/index.html checker/js/*.js checker/js/*/*.js exp/index.html exp/js/*.js
      # 公開するのはアプリのファイルだけ（tests/・docs/ などは含めない）。
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html berry ingredient checker exp css js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
