<!DOCTYPE html>
<html lang="ja" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>育成日数シミュレーター</title>
<!-- 表示テーマはチェッカーと同じ設定（cktheme）を使い、描画の前に当てる。 -->
<script>try{const t=JSON.parse(localStorage.getItem('cktheme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=M+PLUS+2:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../checker/css/theme.css">
<link rel="stylesheet" href="css/exp.css">
</head>
<body>
<!-- ログインはチェッカーと共通（同じ暗証番号・同じ保存）。 -->
<form class="login" id="login" autocomplete="on">
  <h1><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>育成日数シミュレーター</h1>
  <label for="loginPw">暗証番号（数字4桁）</label>
  <input type="password" id="loginPw" name="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
  <p class="loginmsg" id="loginMsg" role="status"></p>
  <button type="submit">ログイン</button>
  <p class="ver">試作版 v0.2</p>
</form>

<div class="appbar">
  <div class="appbar-in">
    <span class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V10M12 10l-4 4M12 10l4 4M5 4h14"/></svg>育成日数シミュレーター<span class="draft">試作</span></span>
    <div class="appbar-act"><button type="button" class="icon" id="themeBtn"></button></div>
  </div>
</div>

<main>
  <section class="mon">
    <div class="monrow">
      <img id="monImg" alt="" width="72" height="72" hidden>
      <div class="field grow">
        <label for="mon">ポケモン</label>
        <select id="mon"></select>
      </div>
    </div>
    <div class="prow"><span>経験値タイプ</span><div class="seg" role="group" aria-label="経験値タイプ" id="typeSeg"><button data-v="600">600</button><button data-v="900">900</button><button data-v="1080">1080</button><button data-v="1320">1320</button></div></div>
    <div class="prow"><span>性格のEXP補正</span><div class="seg" role="group" aria-label="性格のEXP補正" id="natSeg"><button data-v="up">▲ アップ</button><button data-v="none">なし</button><button data-v="down">▼ ダウン</button></div></div>
  </section>

  <section>
    <div class="sec-head"><h2>レベル</h2><span class="hint" id="needHint"></span></div>
    <div class="nums">
      <div class="num"><label for="level">今のレベル</label><input type="number" id="level" min="1" max="69" step="1" inputmode="numeric"></div>
      <div class="num"><label for="toNext">次のレベルまで<small>ゲームの「あと ○○ EXP」</small></label><input type="number" id="toNext" min="1" step="1" inputmode="numeric"></div>
      <div class="num"><label for="target">目標のレベル</label><input type="number" id="target" min="2" max="70" step="1" inputmode="numeric"></div>
    </div>
    <div class="lvseg quick" role="group" aria-label="目標のレベル" id="targetSeg"><button data-v="25">25</button><button data-v="30">30</button><button data-v="50">50</button><button data-v="60">60</button><button data-v="70">70</button></div>
  </section>

  <section>
    <div class="sec-head"><h2>アメ</h2><span class="hint">先にまとめて使う</span></div>
    <div class="nums">
      <div class="num"><label for="candy">使えるアメ</label><input type="number" id="candy" min="0" max="9999" step="1" inputmode="numeric"></div>
      <div class="num"><label for="shardCap">ゆめのかけらの上限<small>空ならなし</small></label><input type="number" id="shardCap" min="0" step="1000" inputmode="numeric" placeholder="なし"></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>睡眠</h2><span class="hint">チームで寝るとき</span></div>
    <div class="nums">
      <div class="num"><label for="score">睡眠スコア<small>8時間30分で100</small></label><input type="number" id="score" min="0" max="100" step="1" inputmode="numeric"></div>
    </div>
    <div class="prow"><span>チームの睡眠EXPボーナス</span><div class="seg" role="group" aria-label="睡眠EXPボーナスの数" id="bonusSeg"><button data-v="0">0</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div></div>
    <div class="field">
      <label for="incense">せいちょうのおこう</label>
      <select id="incense">
        <option value="none">使わない</option>
        <option value="fullMoon">満月の日だけ</option>
        <option value="gsd">グッドスリープデーと満月</option>
        <option value="every2Days">2日に1回</option>
        <option value="everyDay">毎日</option>
      </select>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>おひるね島</h2><span class="hint">1日150EXP</span></div>
    <div class="nums">
      <div class="num"><label for="tickets">リラックスチケット<small>1枚で7日、1日600EXP</small></label><input type="number" id="tickets" min="0" max="99" step="1" inputmode="numeric"></div>
      <div class="num"><label for="start">始める日</label><input type="date" id="start"></div>
    </div>
  </section>

  <section class="res" aria-live="polite">
    <div class="sec-head"><h2>結果</h2><span class="hint" id="resHint"></span></div>
    <div id="candyOut"></div>
    <div id="routes"></div>
    <p class="note" id="moonNote"></p>
  </section>

  <footer class="foot">
    <p class="note">数値はにとよんツールと Pokémon Sleep 攻略・検証 Wiki を参考にしています。グッドスリープデー・満月は月齢からの近似で、実際の日程と1日ずれることがあります。</p>
    <div class="foot-row"><span class="ver">育成日数シミュレーター 試作版 v0.2</span><a class="back" href="../checker/">厳選チェッカーへ</a></div>
  </footer>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
